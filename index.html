<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#111827"><title>商品発掘AI</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f7fb;margin:0;color:#111827}
main{max-width:720px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:25px;margin:4px 0}.muted{color:#6b7280;font-size:13px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#111827;color:white;font-weight:700}
.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #0000000d}.rank{font-size:13px;font-weight:800}.name{font-size:19px;font-weight:800;margin:5px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cell{background:#f8fafc;padding:9px;border-radius:10px}.label{font-size:11px;color:#6b7280}.value{font-weight:700;margin-top:3px}
.ok{color:#047857}.warn{color:#b45309}.bad{color:#b91c1c}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#ecfdf5;font-size:12px;font-weight:700}
#status{margin:12px 0}.empty{padding:24px;background:white;border-radius:18px;text-align:center;line-height:1.7}
</style></head><body><main>
<div class="top"><div><h1>商品発掘AI</h1><div class="muted">AI①探索 → AI②再審査 → TOP商品</div></div><button class="btn" id="notify">通知ON</button></div>
<div id="status" class="muted">最新結果を確認中…</div><section id="results"></section>
<script>
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function render(data){
 const items=Array.isArray(data)?data:[];
 if(!items.length){document.querySelector("#results").innerHTML='<div class="empty"><b>まだ本番データはありません。</b><br>実売確認・仕入れ確認・AI②審査を通過した商品だけが、ここに表示されます。</div>';return;}
 document.querySelector("#results").innerHTML=items.slice(0,5).map((x,i)=>`
 <article class="card"><div class="rank">TOP ${i+1}　<span class="pill">安全仕入れ ${esc(x.safe)}/100</span></div>
 <div class="name">${esc(x.name)}</div><div class="grid">
 <div class="cell"><div class="label">Mercari想定売価</div><div class="value">¥${Number(x.sale).toLocaleString()}</div></div>
 <div class="cell"><div class="label">AliExpress仕入れ</div><div class="value">¥${Number(x.cost).toLocaleString()}</div></div>
 <div class="cell"><div class="label">想定利益</div><div class="value ok">¥${Number(x.profit).toLocaleString()}</div></div>
 <div class="cell"><div class="label">販売トレンド</div><div class="value">${esc(x.trend)}</div></div>
 <div class="cell"><div class="label">現在出品数</div><div class="value">${esc(x.active)}件</div></div>
 <div class="cell"><div class="label">出品滞留</div><div class="value">${esc(x.age)}</div></div></div>
 <p><b>AI②:</b> <span class="${String(x.ai2).includes("条件")?"warn":"ok"}">${esc(x.ai2)}</span>　<b>リスク:</b> ${esc(x.risk)}</p>
 </article>`).join("");
}
async function load(){try{const r=await fetch("/api/results",{cache:"no-store"});if(!r.ok)throw new Error("API "+r.status);const d=await r.json();render(d.items);document.querySelector("#status").textContent=d.updatedAt?"最終更新: "+new Date(d.updatedAt).toLocaleString("ja-JP"):"本番結果を表示中";}catch(e){render([]);document.querySelector("#status").textContent="本番データ接続待ち";}}
document.querySelector("#notify").onclick=async()=>{if(!("Notification"in window))return alert("この端末では通知に対応していません");const p=await Notification.requestPermission();document.querySelector("#status").textContent=p==="granted"?"通知を許可しました":"通知はまだ許可されていません";};
navigator.serviceWorker?.register("/sw.js");load();
</script></main></body></html>
